{% extends "base.html" %}

{% block content %}
<section class="stack admin-shell">
  <section class="card hero-card admin-hero">
    <div class="admin-hero-copy">
      <p class="eyebrow">Admin</p>
      <h1>Operations</h1>
      <p class="lede">Inspect runtime status and query audit history from a dedicated operational surface.</p>
    </div>
  </section>

  {% include "partials/admin-subnav.html" %}

  <section class="stack admin-page-stack">
    <section class="card admin-card">
      <div class="row row-actions">
        <div>
          <p class="eyebrow">Runtime</p>
          <h2>Status</h2>
        </div>
        <button id="refresh-admin-runtime-status" type="button" class="secondary">Refresh Status</button>
      </div>
      <p id="admin-runtime-status-text" class="settings-inline-status hidden" aria-live="polite"></p>
      <div id="admin-runtime-status" class="stack admin-runtime-layout"></div>
    </section>

    <section class="card admin-card">
      <p class="eyebrow">Audit log</p>
      <h2>Recent events</h2>
      <form id="admin-audit-form" class="stack">
        <div class="form-grid">
          <label>
            <strong>Event type</strong>
            <input type="text" name="event_type" placeholder="album_deleted">
          </label>
          <label>
            <strong>Actor ID</strong>
            <input type="text" name="actor_id" placeholder="User who triggered it">
          </label>
          <label>
            <strong>User ID</strong>
            <input type="text" name="user_id" placeholder="Impacted user">
          </label>
          <label>
            <strong>Correlation ID</strong>
            <input type="text" name="correlation_id" placeholder="Trace a request">
          </label>
        </div>
        <div class="form-grid">
          <label>
            <strong>After</strong>
            <input type="datetime-local" name="after">
          </label>
          <label>
            <strong>Before</strong>
            <input type="datetime-local" name="before">
          </label>
          <label>
            <strong>Page size</strong>
            <input type="number" name="limit" min="1" max="100" value="25">
          </label>
          <input id="admin-audit-offset" type="hidden" name="offset" value="0">
        </div>
        <div class="row row-actions">
          <button type="submit">Query Audit</button>
        </div>
      </form>
      <p id="admin-audit-status" class="settings-inline-status hidden" aria-live="polite"></p>
      <p id="admin-audit-summary" class="hint"></p>
      <div id="admin-audit" class="stack admin-audit-list"></div>
      <div class="row row-actions">
        <button id="admin-audit-prev" type="button" class="secondary">Previous</button>
        <button id="admin-audit-next" type="button" class="secondary">Next</button>
      </div>
    </section>
  </section>
</section>
{% endblock %}

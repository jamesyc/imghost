server {
    listen 80;
    server_name img.yourdomain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name img.yourdomain.com;

    ssl_certificate     /etc/letsencrypt/live/img.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/img.yourdomain.com/privkey.pem;

    client_max_body_size 512M;

    # When behind Cloudflare, uncomment real_ip_header and add the published CF ranges.
    # set_real_ip_from 173.245.48.0/20;
    # set_real_ip_from 103.21.244.0/22;
    # real_ip_header CF-Connecting-IP;

    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Required for media seeking and range requests.
        proxy_set_header   Range    $http_range;
        proxy_set_header   If-Range $http_if_range;
        proxy_no_cache     $http_range $http_if_range;
    }
}
